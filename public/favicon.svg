<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#A144F2"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c3ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="rgba(142, 45, 226, 0.4)" stroke-width="8"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent-grad)" stroke-width="12" filter="url(#glow)" opacity="0.6"/>
  
  <!-- Symbol: Stylized MW / AI Node Symbol -->
  <path d="M 120,340 L 180,160 L 256,290 L 332,160 L 392,340" fill="none" stroke="url(#cyan-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 160,340 L 256,200 L 352,340" fill="none" stroke="url(#accent-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Central Glowing Orb -->
  <circle cx="256" cy="200" r="20" fill="#00c3ff" filter="url(#glow)"/>
</svg>
